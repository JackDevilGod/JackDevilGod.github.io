name: Lint

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          auto_fix: true
          eslint: true
          prettier: true